[project]
name = "gametrend"
version = "0.1.0"
description = "GameTrend Radar: real-time trend analytics for Roblox and Steam games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "pymongo>=4.20.0",
    "requests>=2.32",
]

[project.optional-dependencies]
spark = [
    # pyspark 3.5 predates pandas 3 and numpy 2: keep pandas 2.2 / numpy 1.x / pyarrow < 16
    "numpy>=1.24,<2",
    "pandas>=2.2,<2.3",
    "pyarrow>=12,<16",
    "pyspark==3.5.9",
]

[dependency-groups]
dev = [
    # same pandas/numpy as the Spark image, so host tests see the same behaviour
    "numpy>=1.24,<2",
    "pandas>=2.2,<2.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gametrend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "spark: tests that start a local SparkSession (skip with -m 'not spark')",
    "live: tests that call the real APIs; never run by default (run with -m live)",
]
