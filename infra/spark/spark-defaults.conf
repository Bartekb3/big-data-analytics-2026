# Defaults for every Spark job in the gametrend-spark image (read through SPARK_CONF_DIR).
# Local mode: driver and executors share one JVM per container; memory comes from SPARK_DRIVER_MEMORY in docker-compose.yml.
spark.master                    local[*]
spark.sql.session.timeZone      UTC
# The default 200 only adds overhead on one machine.
spark.sql.shuffle.partitions    4
spark.ui.showConsoleProgress    false
