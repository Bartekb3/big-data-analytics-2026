# Keeps names the same in every clone and worktree: gametrend_kafka-data, gametrend_default.
name: gametrend

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      # Localhost only: the listener has no authentication.
      - "127.0.0.1:9094:9094"
    environment:
      # Setting any KAFKA_* variable makes the image skip its default config, so the full set is needed.
      # Written to the volume on first start; another value later stops the broker (Invalid cluster.id).
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # INTERNAL for containers (kafka:9092), HOST for the Mac (127.0.0.1:9094, not localhost: that can resolve to IPv6, where the port is not published).
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # One broker, so the internal topics cannot have more replicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    # Unused paths the image declares as volumes; without this every down + up leaves two anonymous volumes behind.
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Runs once when the broker is healthy, then exits. "up --wait" does not wait for it or report its failure:
  # use "docker compose up -d && docker compose wait kafka-init" (alone, wait returns 0 for an init that never
  # started), or depends_on with service_completed_successfully in a service.
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/create-topics.sh:/create-topics.sh:ro
    # Same reason as in kafka, plus the data path, which this service does not use.
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
      - /var/lib/kafka/data
    command: ["sh", "/create-topics.sh"]

volumes:
  kafka-data:
