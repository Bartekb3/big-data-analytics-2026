# Keeps names the same in every clone and worktree: gametrend_kafka-data, gametrend_mongo-data, ..., gametrend_default.
name: gametrend

# Shared by the Spark jobs (speed, batch): one image, local mode, code bind-mounted read-only.
# Started only with the "spark" profile: docker compose --profile spark up -d.
x-spark: &spark
  image: gametrend-spark:dev
  build:
    context: .
    dockerfile: infra/spark/Dockerfile
  profiles: ["spark"]
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    mongo-init:
      condition: service_completed_successfully

# Addresses inside the compose network; .env is not loaded, so the values for this computer cannot leak in.
x-spark-env: &spark-env
  KAFKA_BOOTSTRAP: kafka:9092
  MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      # Localhost only: the listener has no authentication.
      - "127.0.0.1:9094:9094"
    environment:
      # Setting any KAFKA_* variable makes the image skip its default config, so the full set is needed.
      # Written to the volume on first start; another value later stops the broker (Invalid cluster.id).
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # INTERNAL for containers (kafka:9092), HOST for the Mac (127.0.0.1:9094, not localhost: that can resolve to IPv6, where the port is not published).
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # One broker, so the internal topics cannot have more replicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # JVM option, not a broker setting (the default is 1G); keeps the whole stack within a laptop's Docker Desktop.
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    # Unused paths the image declares as volumes; without this every down + up leaves two anonymous volumes behind.
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Runs once when the broker is healthy, then exits. "up --wait" does not wait for it or report its failure:
  # use "docker compose up -d && docker compose wait kafka-init" (alone, wait returns 0 for an init that never
  # started), or depends_on with service_completed_successfully in a service.
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/create-topics.sh:/create-topics.sh:ro
    # Same reason as in kafka, plus the data path, which this service does not use.
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
      - /var/lib/kafka/data
    command: ["sh", "/create-topics.sh"]

  # Single-node replica set rs0 (needed for multi-document transactions). No authentication: localhost only.
  mongodb:
    image: mongo:7.0.16
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      # From this computer connect with directConnection=true: the member name "mongodb" does not resolve here.
      - "127.0.0.1:27017:27017"
    mem_limit: 1g
    volumes:
      # Also holds the replica set configuration, so rs0 survives down + up.
      - mongo-data:/data/db
    # Declared as a volume by the image, used only by sharding config servers.
    tmpfs:
      - /data/configdb
    # Only "is mongod up": the replica set is initiated later by mongo-init, which waits for this check.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Runs once when mongod is healthy: initiates rs0 if needed, waits for PRIMARY, creates the contract's indexes,
  # then exits. Same rules as kafka-init: wait for it with "docker compose wait", or depend on it with
  # service_completed_successfully.
  mongo-init:
    image: mongo:7.0.16
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./infra/init-mongo.js:/init-mongo.js:ro
    # Paths the image declares as volumes; this service uses neither.
    tmpfs:
      - /data/db
      - /data/configdb
    command: ["mongosh", "--host", "mongodb", "--quiet", "--file", "/init-mongo.js"]

  speed:
    <<: *spark
    command: ["python", "-m", "gametrend.speed"]
    # The one service with a restart policy (infra/README.md): speed fails fast on a MongoDB error and
    # resumes from its checkpoint after the restart; 5 failures in a row mean a real bug, not a hiccup.
    restart: on-failure:5
    environment:
      <<: *spark-env
      SPARK_DRIVER_MEMORY: 1g
      SPEED_CHECKPOINT_DIR: /data/checkpoints/speed
    mem_limit: 2g
    ports:
      - "127.0.0.1:4040:4040"    # Spark UI
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - speed-checkpoint:/data/checkpoints/speed

  batch:
    <<: *spark
    command: ["python", "-m", "gametrend.batch"]
    # batch logs step failures and keeps cycling; it exits only when its SparkSession is dead, and then
    # resumes from the sink checkpoint and the hourly aggregates already in MongoDB.
    restart: on-failure:5
    environment:
      <<: *spark-env
      SPARK_DRIVER_MEMORY: 1500m
      ARCHIVE_CHECKPOINT_DIR: /data/checkpoints/archive
      MASTER_DIR: /data/master
      # Optional, defaults in src/gametrend/batch/config.py. Accelerated replay: BATCH_INTERVAL_S ~ 3600 / speed,
      # BATCH_RETENTION_HOURS e.g. 48 (minimum 25).
      BATCH_INTERVAL_S: ${BATCH_INTERVAL_S:-3600}
      BATCH_RETENTION_HOURS: ${BATCH_RETENTION_HOURS:-336}
    mem_limit: 2560m
    ports:
      - "127.0.0.1:4041:4040"    # Spark UI
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - archive-checkpoint:/data/checkpoints/archive
      # Parquet master dataset: append-only, never deleted. "docker compose down -v" DELETES it too.
      - master-data:/data/master

volumes:
  kafka-data:
  mongo-data:
  speed-checkpoint:
  archive-checkpoint:
  master-data:
